name: TypeScript Check

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Auto-cancel superseded PR runs (SPE-405). Only pull_request runs share a
# group; push-to-main keys on the unique run id, so each main commit sits in a
# group of one and is never cancelled or queued behind another — main keeps a
# complete per-commit record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 20 + `npm ci`, matching simple-tests.yml (SPE-118). The two used to
      # disagree — Node 18 + `npm install` here — so this workflow could pass or
      # fail on a different resolved dependency tree than the one CI builds.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck
